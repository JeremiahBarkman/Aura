<!DOCTYPE html>
<html>
<head>
    <title>Aura Slide Output</title>
    <link rel="icon" type="image/png" href="/assets/favicon.png">

    <style>
        html,
        body {
            margin: 0;
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #000;
        }

        #slideStage {
            position: fixed;
            inset: 0;
            background: #000;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .slide-image {
            position: absolute;
            max-width: 100%;
            max-height: 90%;
            object-fit: contain;
            opacity: 0;
            transition: opacity 800ms ease-in-out;
        }

        .slide-image.active {
            opacity: 1;
        }

        #bottomFade {
            position: fixed;
            left: 0;
            right: 0;
            bottom: 0;
            height: 22%;
            pointer-events: none;
            background: linear-gradient(
                to bottom,
                rgba(0, 0, 0, 0),
                rgba(0, 0, 0, 0.92)
            );
        }

    </style>
        </head>

            <body>
            <div id="slideStage">
                <img id="imageA" class="slide-image active">
                <img id="imageB" class="slide-image">
    </div>

    <div id="bottomFade"></div>

    <script type="module">

        import { SceneRenderer } from '/rendering/SceneRenderer.js';
        import { SceneImageCache } from '/rendering/SceneImageCache.js';
        import { applyDisplayModeToScene } from '/rendering/DisplaySceneMapper.js';

        const sceneCanvas = document.createElement('canvas');

        const sceneRenderer =
            new SceneRenderer(sceneCanvas);

        const sceneImageCache =
            new SceneImageCache();

        let currentImageUrl = '';
        let showingA = true;

        let currentSceneKey = '';
        let currentSceneStartedAt = 0;
        let pendingScene = null;

function getSceneKey(scene) {
    if (!scene || !Array.isArray(scene.slots)) {
        return '';
    }

    return [
        scene.sceneMode || 'single',
        ...scene.slots.map(slot => slot.image_id || slot.image_path || '')
    ].join('|');
}

function getMinimumDisplayMs(scene) {
    return Number(scene?.transition?.minimumDisplayMs || 0);
}

function canReplaceCurrentScene(nextScene) {
    if (!currentSceneKey) {
        return true;
    }

    const now = Date.now();
    const minimumDisplayMs = getMinimumDisplayMs(nextScene);

    return now - currentSceneStartedAt >= minimumDisplayMs;
}

async function loadSceneImages(slots) {
    return sceneImageCache.loadSlots(
        slots,
        imageUrlFromPath
    );
}

let slideOutputConfig = {
    displayMode: 'single'
};

async function loadSlideOutputConfig() {
    const response = await fetch('/api/config');
    const result = await response.json();

    if (response.ok && result.success && result.config) {
        slideOutputConfig = result.config;
    }

    return slideOutputConfig;
}

function getSlideDisplayMode() {
    return slideOutputConfig.displayMode || 'single';
}

        function imageUrlFromPath(imagePath, workflowName = '') {
            if (!imagePath) {
                return '';
            }

            const normalized = imagePath.replaceAll('\\', '/');
            const fileName = normalized.split('/').pop();

            // Match on /images/imports/ (not /data/images/imports/) so both
            // the dev layout (<repo>/data/images/...) and the packaged layout
            // (userData/images/...) classify correctly.
            if (normalized.includes('/images/imports/')) {
                return `/imported-images/${encodeURIComponent(fileName)}`;
            }

            if (normalized.includes('/images/manual/')) {
                return `/manual-images/${encodeURIComponent(fileName)}`;
            }

            if (normalized.includes('/images/generated/') || normalized.includes('/ComfyUI/output/')) {
                return `/generated-images/${encodeURIComponent(fileName)}`;
            }

            return `/manual-images/${encodeURIComponent(fileName)}`;
        }

function swapImage(imageUrl, transition = {}) {
    if (!imageUrl || imageUrl === currentImageUrl) {
        return;
    }

    const transitionType =
        transition.type || 'crossfade';

    const durationMs =
        Number(transition.durationMs || 800);

    const easing =
        transition.easing || 'ease-in-out';

    const imageA = document.getElementById('imageA');
    const imageB = document.getElementById('imageB');

    const incoming = showingA ? imageB : imageA;
    const outgoing = showingA ? imageA : imageB;

    incoming.style.transition =
        `opacity ${durationMs}ms ${easing}`;

    outgoing.style.transition =
        `opacity ${durationMs}ms ${easing}`;

    incoming.onload = () => {
        if (transitionType === 'instant' || durationMs === 0) {
            incoming.style.transition = 'none';
            outgoing.style.transition = 'none';

            incoming.classList.add('active');
            outgoing.classList.remove('active');
        } else if (transitionType === 'fade') {
            outgoing.classList.remove('active');

            setTimeout(() => {
                incoming.classList.add('active');
            }, durationMs);
        } else {
            // crossfade default
            incoming.classList.add('active');
            outgoing.classList.remove('active');
        }

        showingA = !showingA;
        currentImageUrl = imageUrl;
    };

    incoming.src = imageUrl;
}

async function renderSceneWithSharedRenderer(scene) {
    const slots =
        Array.isArray(scene.slots)
            ? scene.slots
            : [];

    if (!slots.length) {
        return false;
    }

    const loadedImages =
        await loadSceneImages(slots);

    sceneRenderer.resize(
        window.innerWidth,
        window.innerHeight
    );

    sceneRenderer.render(
        scene,
        loadedImages
    );

    const imageUrl =
        sceneCanvas.toDataURL('image/png');

    swapImage(
        imageUrl,
        scene.transition || {}
    );

    return true;
}

function renderScene(scene) {
    const slots =
        Array.isArray(scene.slots)
            ? scene.slots
            : [];

    if (!slots.length) {
        return;
    }

    const sceneKey = getSceneKey(scene);

    if (sceneKey === currentSceneKey) {
        return;
    }

    if (!canReplaceCurrentScene(scene)) {
        pendingScene = scene;
        return;
    }

    pendingScene = null;
    currentSceneKey = sceneKey;
    currentSceneStartedAt = Date.now();

    // Every scene mode (single/dual/triple/aura) is drawn through the same
    // shared SceneRenderer, so the layout matches the camera composite exactly.
    renderSceneWithSharedRenderer(scene).catch(error => {
        console.error('Shared renderer error:', error);
    });
}

// Fades whichever image layer is showing back out and resets the render
// bookkeeping, so a later scene -- including a repeat of the one just
// cleared -- is not deduped away by currentSceneKey/currentImageUrl.
function clearDisplay() {
    const imageA = document.getElementById('imageA');
    const imageB = document.getElementById('imageB');

    // Clearing uses the same transition the user picked for scene changes
    // (Studio's Transition Type / Duration, mirrored into aura-config). There
    // is no scene to read a transition off -- activeScene is null by the time
    // we get here -- so it comes from the config the poll already loads.
    const transitionType =
        slideOutputConfig.transitionType || 'crossfade';

    const durationMs =
        Number(slideOutputConfig.transitionDurationMs ?? 800);

    const animate =
        transitionType !== 'instant' && durationMs > 0;

    // Visibility is driven by the .active class (.slide-image is opacity 0,
    // .slide-image.active is opacity 1) -- NOT by inline opacity. Setting
    // inline opacity here would look correct immediately but permanently
    // outrank the class, so every later swapImage would add .active to a
    // layer that stays invisible and the output could never show anything
    // again.
    for (const layer of [imageA, imageB]) {
        layer.style.transition = animate
            ? `opacity ${durationMs}ms ease-in-out`
            : 'none';

        layer.classList.remove('active');
    }

    currentImageUrl = '';
    currentSceneKey = '';
    currentSceneStartedAt = 0;
    pendingScene = null;
}

function tryRenderPendingScene() {
    if (!pendingScene) {
        return;
    }

    if (canReplaceCurrentScene(pendingScene)) {
        const sceneToRender = pendingScene;
        pendingScene = null;
        renderScene(sceneToRender);
    }
}

async function pollActiveScene() {
    try {
        await loadSlideOutputConfig();

        const response = await fetch('/api/play/active-scene');
        const result = await response.json();

        const rawScene = result.activeScene;

        // A null scene means Play Mode's Clear Scene emptied the stage (it is
        // also the pre-first-match state). Returning early here would leave
        // the last slide on screen forever, so fade it out instead. Guarded on
        // currentImageUrl so the normal "nothing has matched yet" case does no
        // work on every 750ms poll.
        if (!rawScene) {
            if (currentImageUrl) {
                clearDisplay();
            }

            return;
        }

        const displayScene =
            applyDisplayModeToScene(rawScene, getSlideDisplayMode());

        renderScene(displayScene);
        tryRenderPendingScene();

    } catch (error) {
        console.error('Aura Slide Output error:', error);
    }
}

        setInterval(pollActiveScene, 750);
        pollActiveScene();
    </script>
</body>
</html>
