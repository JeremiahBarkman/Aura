<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Segmentation Factory Test</title>
<style>
 body { font-family: monospace; background:#111; color:#eee; padding:20px }
 .pass { color:#8fd18a } .fail { color:#e08b7a } .info { color:#a1968a }
</style>
</head>
<body>
<h3>createSegmentationProvider — registry test</h3>
<div id="log"></div>
<script type="module">
const logEl = document.getElementById('log');
const results = [];

function log(m, c = 'info') {
    const d = document.createElement('div');
    d.className = c; d.textContent = m; logEl.appendChild(d);
}
function check(name, cond, detail = '') {
    results.push({ name, ok: !!cond });
    log(`${cond ? 'PASS' : 'FAIL'}  ${name}${detail ? ' — ' + detail : ''}`,
        cond ? 'pass' : 'fail');
}

const mod = await import('/segmentation/createSegmentationProvider.js');
const { createSegmentationProvider, listSegmentationEngines, DEFAULT_ENGINE } = mod;

check('default engine is paddleseg (bundled model, no licence needed)',
    DEFAULT_ENGINE === 'paddleseg', DEFAULT_ENGINE);

const engines = listSegmentationEngines();
log('registered: ' + JSON.stringify(engines));
check('both engines registered', engines.length === 2);
check('psyseg listed', engines.some(e => e.id === 'psyseg'));
check('paddleseg listed', engines.some(e => e.id === 'paddleseg'));

// paddleseg: constructed (not initialized -- no real model needed for this).
const paddle = await createSegmentationProvider('paddleseg', {
    modelUrl: '/models/paddleseg/__synthetic_test.onnx'
});
check('paddleseg constructs', !!paddle);
check('paddleseg tagged with engineId', paddle.engineId === 'paddleseg', paddle.engineId);
check('paddleseg honours modelUrl option',
    paddle.modelUrl === '/models/paddleseg/__synthetic_test.onnx', paddle.modelUrl);

// Contract: every method the live consumers call must exist on the provider.
const REQUIRED = ['initialize','attachVideo','attachCanvas','blurBackground',
    'removeBackground','replaceBackground','startBackgroundTransition','stop','dispose'];

const missingPaddle = REQUIRED.filter(m => typeof paddle[m] !== 'function');
check('paddleseg implements full consumer contract',
    missingPaddle.length === 0, missingPaddle.join(',') || 'all present');
check('paddleseg exposes erodeLevel/blurLevel',
    typeof paddle.erodeLevel === 'number' && typeof paddle.blurLevel === 'number');

// psyseg: constructed via the same factory. Not initialized (needs the SDK
// + licence), but the contract check still applies.
const psy = await createSegmentationProvider('psyseg');
check('psyseg constructs via factory', !!psy);
check('psyseg tagged with engineId', psy.engineId === 'psyseg', psy.engineId);

const missingPsy = REQUIRED.filter(m => typeof psy[m] !== 'function');
check('psyseg implements full consumer contract',
    missingPsy.length === 0, missingPsy.join(',') || 'all present');

// Unknown id must degrade to the working engine, not throw.
const fallback = await createSegmentationProvider('does-not-exist');
check('unknown engine falls back to paddleseg (no throw)',
    fallback.engineId === 'paddleseg', fallback.engineId);

const undef = await createSegmentationProvider(undefined);
check('undefined engine falls back to default', undef.engineId === 'paddleseg', undef.engineId);

const failed = results.filter(r => !r.ok);
log(`\n${results.length - failed.length}/${results.length} passed`, failed.length ? 'fail' : 'pass');
window.__testDone = { results, failed: failed.map(f => f.name) };
</script>
</body>
</html>
